[project]
name = "cedrus-mcp"
version = "2.0.1"
description = "Reasoning scaffolding that supercharges your small AI: an argument-mapping MCP server"
authors = [
    {name = "Gregor Betz", email = "3662782+ggbetz@users.noreply.github.com"}
]
scripts = { "cedrus" = "cedrus.__main__:main", "cedrus-mcp" = "cedrus.__main__:main" }
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
]
keywords = ["mcp", "argument-mapping", "argumentation", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/cedrus-mcp/cedrus-mcp"
Issues = "https://github.com/cedrus-mcp/cedrus-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cedrus"]

[tool.hatch.build.targets.sdist]
exclude = ["alias", "opencode.jsonc", ".github", "server.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1",
]
