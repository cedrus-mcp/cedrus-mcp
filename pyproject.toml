[project]
name = "koala"
version = "0.1.0"
description = "KOALA - Agent-centric MCP server for informal argument mapping"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
scripts = { "koala" = "koala.__main__:main" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "pydantic-settings>=2.12.0",
    "graphviz>=0.20",
    "Unidecode>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koala"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "types-networkx>=3.6.0.20251127",
]
