[project]
name = "cedrus"
version = "2.0.0dev"
description = "CEDRUS - a minimal argument-mapping MCP server for small language models"
authors = [
    {name = "Gregor Betz", email = "3662782+ggbetz@users.noreply.github.com"}
]
scripts = { "cedrus" = "cedrus.__main__:main" }
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cedrus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1",
]
